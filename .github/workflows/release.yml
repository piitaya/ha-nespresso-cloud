name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set manifest version from tag
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/nespresso_cloud/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/nespresso_cloud/manifest.json

      - name: Zip integration
        run: |
          cd custom_components/nespresso_cloud
          zip -r ../../nespresso_cloud.zip .

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: nespresso_cloud.zip
